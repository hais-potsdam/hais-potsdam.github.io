<!doctype html>
<html lang="{{ with .Params.htmlLang }}{{ . }}{{ else }}{{ site.Language.LanguageCode }}{{ end }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fafaf6">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon.png" | relURL }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · HAIS{{ end }}</title>
  <link rel="preload" href="{{ "fonts/noto-serif-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "fonts/noto-sans-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  {{ with resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{ end }}
  {{ if .IsHome }}
    {{ with resources.Get "js/main.js" | minify | fingerprint }}
      <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
    {{ end }}
  {{ end }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
